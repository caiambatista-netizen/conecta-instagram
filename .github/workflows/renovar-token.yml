name: Instagram — Renovar tokens

on:
  schedule:
    - cron: "23 9 1,15 * *"   # dias 1 e 15 (token vale 60 dias)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Renovar
        env:
          IG_TOKEN_PESSOAL: ${{ secrets.IG_TOKEN_PESSOAL }}
          IG_TOKEN_CONECTA: ${{ secrets.IG_TOKEN_CONECTA }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: python renovar_token.py

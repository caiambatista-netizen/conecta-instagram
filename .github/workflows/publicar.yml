name: Instagram — Publicar fila

on:
  schedule:
    - cron: "7 * * * *"   # toda hora, no minuto 7
  workflow_dispatch:
    inputs:
      modo:
        description: "publicar | simular | testar (só confere se os tokens funcionam)"
        required: false
        default: "publicar"

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar
        env:
          IG_TOKEN_PESSOAL: ${{ secrets.IG_TOKEN_PESSOAL }}
          IG_TOKEN_CONECTA: ${{ secrets.IG_TOKEN_CONECTA }}
        run: |
          case "${{ github.event.inputs.modo }}" in
            simular) python publicar.py --simular ;;
            testar)  python -c "import ig; [print(c, ig.perfil(c)['username']) for c in ig.CONTAS]" ;;
            *)       python publicar.py ;;
          esac
      - name: Salvar registro
        if: always()
        run: |
          git config user.name "conecta-instagram"
          git config user.email "conecta-instagram@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Publicados $(date +'%F %H:%M')"
          git pull --rebase -q origin main && git push || true
